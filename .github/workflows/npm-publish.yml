# Trusted Publishing: npm is told which repository and which workflow may publish, and
# GitHub proves it with an OIDC token. There is no npm token in this repository to steal,
# and the published tarball carries a provenance attestation naming this commit.
#
# One-time setup on npmjs.com: package -> Settings -> Trusted Publisher -> GitHub Actions,
# repository ciceroyang/dsh-privacy-guard, workflow npm-publish.yml.
#
# Until that setup exists, this workflow is manual only: with a tag trigger a pushed
# vX.Y.Z would fail here, and a publish workflow that swallows its own failure would be
# the exact defect this project exists to avoid. After the setup, add
#   push:
#     tags: ["v*"]
# back under `on:` and tag releases as usual.
name: npm publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: The committed bundle must match its sources
        run: |
          node build.mjs
          git diff --exit-code lib/client.js
      - name: Refuse to publish if the tests fail
        run: node --test
      - name: Refuse to publish a version that is not tagged
        run: |
          version="$(node -p "require('./package.json').version")"
          git rev-parse -q --verify "refs/tags/v$version" >/dev/null || { echo "no tag v$version"; exit 1; }
      - name: Publish with provenance
        run: npm publish --provenance --access public
